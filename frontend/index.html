  <head>
    <meta charset="UTF-8" />

    <title>Sistema Integral de Ventas</title>
    <!-- v2.2.7: Eliminada carga de Google Fonts.
         Antes: fonts.googleapis.com (ralentizaba el primer render en Electron
         y causaba que el browser estuviera ocupado durante ~500ms con la red).
         Ahora: usamos fuentes del sistema (-apple-system, BlinkMacSystemFont)
         que son nativas y cero-latencia en Mac.
         El estilo visual sigue siendo consistente con tu diseno original. -->
    <!-- v2.2.7: Script SPA redirect ELIMINADO.
         Antes: ejecutaba window.history.replaceState() inmediatamente al cargar,
         ANTES de que React se montara. Esto interferia con:
         - Eventos de input (paste, focus) -> no se podia pegar al primer click
         - Scroll natural -> quedaba "pegado" en cada navegacion
         Solo era util para GitHub Pages (que no aplica a Electron/Render). -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
