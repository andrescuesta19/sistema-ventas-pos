services:
  - type: web
    name: pos-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: |
      cd frontend
      npm install
      npm run build
      cd ..
      mkdir -p backend/frontend
      rm -rf backend/frontend/dist
      cp -r frontend/dist backend/frontend/dist
      cd backend
      npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: 3000
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://andrescuesta19.github.io,https://sistema-ventas-pos-aeka.onrender.com
    healthCheckPath: /api/health
